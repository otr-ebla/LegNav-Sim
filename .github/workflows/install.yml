name: Installation smoke test
on: [push, pull_request, workflow_dispatch]
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m pip check
      - name: Test installed package outside the source tree
        working-directory: ${{ runner.temp }}
        run: python -m legnav.evaluation.jax_eval_multi --algo sac --ckpt "${{ github.workspace }}/checkpoints/sac/sac_best.msgpack" --headless --steps 3
